name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Download Gradle and build
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          DIR=$(dirname "$(find . -name settings.gradle -not -path './gradle-8.10/*' | head -n 1)")
          echo "Project folder: $DIR"
          cd "$DIR"
          "$GITHUB_WORKSPACE/gradle-8.10/bin/gradle" build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: greenlantern-mod-jar
          path: "**/build/libs/*.jar"
